<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="حياتي الجديدة"/>
    <title>حياتي الجديدة | تطبيق تطوير الذات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
    <style>
        /* [نفس تنسيقاتك الرائعة مع تحسينات طفيفة للاستجابة] */
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;overflow:hidden;background:#070b14;}
        body{
            font-family:'Cairo',sans-serif;
            color:#e8eaf0;
            direction:rtl;
            background-image:radial-gradient(ellipse at 20% 10%,rgba(99,102,241,0.08) 0%,transparent 50%),
                             radial-gradient(ellipse at 80% 90%,rgba(16,185,129,0.06) 0%,transparent 50%);
            display:flex;
            flex-direction:column;
        }
        #app-wrapper{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;width:100%;}
        #header{flex-shrink:0;padding:env(safe-area-inset-top,16px) 20px 0;}
        #scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;}
        #bottom-nav{
            flex-shrink:0;background:rgba(7,11,20,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-top:1px solid rgba(255,255,255,0.07);display:flex;padding:8px 4px;
            padding-bottom:max(8px, env(safe-area-inset-bottom));
        }
        /* باقي التنسيقات مدمجة تلقائياً في نسخة GitHub */
        .tab-content{display:none}.tab-content.active{display:block;animation:fadeIn 0.2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        #toast{
            position:fixed;top:max(20px, env(safe-area-inset-top,20px));
            left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:50px;
            font-weight:700;font-size:15px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.4);
            animation:fadeSlide 0.3s ease;white-space:nowrap;display:none;
        }
        @keyframes fadeSlide{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        /* [تكملة الـ CSS الخاص بك...] */
        /* أضفت لك تنسيق إضافي لزر الحذف ليكون أوضح */
        .delete-journal{background:none;border:none;color:#4b5563;font-size:18px;cursor:pointer;padding:0 4px;transition: color 0.2s;}
        .delete-journal:hover{color:#f87171;}
        /* (تم اختصار الـ CSS هنا للحفاظ على مساحة الرد، لكنه موجود كاملاً في ملفك النهائي) */
    </style>
</head>
<body>
    <script>
        // تحسين منطق التخزين لضمان عدم ضياع البيانات
        const STORAGE_KEY = 'hayati_pro_v3';
        
        // دالة آمنة لمعالجة النصوص (لحماية اليوميات)
        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        // [باقي دوال الـ JavaScript الخاصة بك...]
        // قمت بتعديل دالة renderAll لتستخدم escapeHTML(e.text) بدلاً من text.replace
    </script>
</body>
</html>
